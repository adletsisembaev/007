<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Cabinet Designer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    Form conventions (read by app.js):
      data-key="name"          parameter sent to Ruby
      data-type="mm|enum|bool" value type
      data-i18n="key"          element text taken from locales/<code>.json
      data-categories="base"   row shown only for the listed categories
      data-show-if="k=v1,v2"   row shown only when field k has one of the values
                               (several conditions separated by ";")
      data-error-for="name"    container for the field's validation message
  -->
  <header class="app-header">
    <h1 data-i18n="dialog.title">Kitchen Cabinet Designer</h1>
    <div id="edit-target" class="edit-target" hidden>
      <span id="edit-target-label"></span>
      <button type="button" id="btn-stop-editing" class="link-button" data-i18n="button.stop_editing">Stop editing</button>
    </div>
  </header>

  <main id="form" class="form">
    <details class="section" open>
      <summary data-i18n="section.type">Cabinet Type</summary>
      <div class="segmented" role="radiogroup" aria-label="Category">
        <button type="button" role="radio" data-category-button="base" data-i18n="category.base">Base cabinet</button>
        <button type="button" role="radio" data-category-button="wall" data-i18n="category.wall">Wall cabinet</button>
      </div>
      <div class="row">
        <label for="f-cabinet_type" data-i18n="field.cabinet_type">Cabinet type</label>
        <select id="f-cabinet_type" data-key="cabinet_type" data-type="enum"></select>
        <div class="field-error" data-error-for="cabinet_type"></div>
      </div>
    </details>

    <details class="section" open>
      <summary data-i18n="section.dimensions">Dimensions</summary>
      <div class="row">
        <label for="f-width" data-i18n="field.width">Width</label>
        <div class="input-unit">
          <input id="f-width" type="text" inputmode="decimal" autocomplete="off" data-key="width" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="width"></div>
      </div>
      <div class="row">
        <label for="f-height" data-i18n="field.height">Height</label>
        <div class="input-unit">
          <input id="f-height" type="text" inputmode="decimal" autocomplete="off" data-key="height" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-categories="base" data-i18n="hint.height_base"></div>
        <div class="hint" data-categories="wall" data-i18n="hint.height_wall"></div>
        <div class="field-error" data-error-for="height"></div>
      </div>
      <div class="row">
        <label for="f-depth" data-i18n="field.depth">Depth</label>
        <div class="input-unit">
          <input id="f-depth" type="text" inputmode="decimal" autocomplete="off" data-key="depth" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.depth"></div>
        <div class="field-error" data-error-for="depth"></div>
      </div>
    </details>

    <details class="section" open>
      <summary data-i18n="section.construction">Construction Settings</summary>
      <div class="row">
        <label for="f-thickness" data-i18n="field.thickness">Panel thickness</label>
        <div class="input-unit">
          <input id="f-thickness" type="text" inputmode="decimal" autocomplete="off" data-key="thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="thickness"></div>
      </div>
      <div class="row" data-categories="base">
        <label for="f-top_construction" data-i18n="field.top_construction">Top construction</label>
        <select id="f-top_construction" data-key="top_construction" data-type="enum">
          <option value="rails" data-i18n="option.top.rails">Two rails (front + rear)</option>
          <option value="top_panel" data-i18n="option.top.top_panel">Top panel</option>
          <option value="none" data-i18n="option.top.none">None (open top)</option>
        </select>
        <div class="field-error" data-error-for="top_construction"></div>
      </div>
      <div class="row" data-categories="base" data-show-if="top_construction=rails">
        <label for="f-rail_width" data-i18n="field.rail_width">Rail width</label>
        <div class="input-unit">
          <input id="f-rail_width" type="text" inputmode="decimal" autocomplete="off" data-key="rail_width" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.rail_width"></div>
        <div class="field-error" data-error-for="rail_width"></div>
      </div>
      <div class="row">
        <label for="f-back_mode" data-i18n="field.back_mode">Back panel</label>
        <select id="f-back_mode" data-key="back_mode" data-type="enum">
          <option value="overlay" data-i18n="option.back.overlay">Overlay (applied to the rear)</option>
          <option value="inset" data-i18n="option.back.inset">Inset (between panels)</option>
          <option value="none" data-i18n="option.back.none">No back panel</option>
        </select>
        <div class="field-error" data-error-for="back_mode"></div>
      </div>
      <div class="row" data-show-if="back_mode=overlay,inset">
        <label for="f-back_thickness" data-i18n="field.back_thickness">Back panel thickness</label>
        <div class="input-unit">
          <input id="f-back_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="back_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="back_thickness"></div>
      </div>
      <div class="row" data-show-if="back_mode=inset">
        <label for="f-back_inset" data-i18n="field.back_inset">Back panel position</label>
        <div class="input-unit">
          <input id="f-back_inset" type="text" inputmode="decimal" autocomplete="off" data-key="back_inset" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.back_inset"></div>
        <div class="field-error" data-error-for="back_inset"></div>
      </div>
      <div class="row checkbox-row" data-show-if="back_mode=inset">
        <label for="f-back_groove" data-i18n="field.back_groove">Back panel in groove</label>
        <div><input id="f-back_groove" type="checkbox" data-key="back_groove" data-type="bool"></div>
        <div class="field-error" data-error-for="back_groove"></div>
      </div>
      <div class="row" data-show-if="back_mode=inset;back_groove=true">
        <label for="f-groove_depth" data-i18n="field.groove_depth">Groove depth</label>
        <div class="input-unit">
          <input id="f-groove_depth" type="text" inputmode="decimal" autocomplete="off" data-key="groove_depth" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="groove_depth"></div>
      </div>
      <div class="row" data-show-if="back_mode=inset;back_groove=true">
        <label for="f-groove_play" data-i18n="field.groove_play">Groove play</label>
        <div class="input-unit">
          <input id="f-groove_play" type="text" inputmode="decimal" autocomplete="off" data-key="groove_play" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.groove_play"></div>
        <div class="field-error" data-error-for="groove_play"></div>
      </div>
      <div class="row" data-show-if="back_mode=inset;back_groove=true">
        <label for="f-groove_extra_width" data-i18n="field.groove_extra_width">Groove extra width</label>
        <div class="input-unit">
          <input id="f-groove_extra_width" type="text" inputmode="decimal" autocomplete="off" data-key="groove_extra_width" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.groove_extra_width"></div>
        <div class="field-error" data-error-for="groove_extra_width"></div>
      </div>
    </details>

    <details class="section" open data-show-if="cabinet_type=single_door,two_doors,open,corner,sink,appliance,custom">
      <summary data-i18n="section.shelves">Shelves</summary>
      <div class="row">
        <label for="f-shelf_count" data-i18n="field.shelf_count">Number of shelves</label>
        <div class="input-unit">
          <input id="f-shelf_count" type="text" inputmode="decimal" autocomplete="off" data-key="shelf_count" data-type="int">
          <span class="unit"></span>
        </div>
        <div class="field-error" data-error-for="shelf_count"></div>
      </div>
      <div class="row">
        <label for="f-shelf_front_setback" data-i18n="field.shelf_front_setback">Shelf front setback</label>
        <div class="input-unit">
          <input id="f-shelf_front_setback" type="text" inputmode="decimal" autocomplete="off" data-key="shelf_front_setback" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.shelf_front_setback"></div>
        <div class="field-error" data-error-for="shelf_front_setback"></div>
      </div>
    </details>

    <details class="section" open data-show-if="cabinet_type=single_door,two_doors,drawers">
      <summary data-i18n="section.fronts">Doors and Fronts</summary>
      <div class="row">
        <label for="f-front_mount" data-i18n="field.front_mount">Front mounting</label>
        <select id="f-front_mount" data-key="front_mount" data-type="enum">
          <option value="overlay" data-i18n="option.front.overlay">Overlay (in front of the carcass)</option>
          <option value="inset" data-i18n="option.front.inset">Inset (inside the carcass opening)</option>
        </select>
        <div class="field-error" data-error-for="front_mount"></div>
      </div>
      <div class="row">
        <label for="f-front_thickness" data-i18n="field.front_thickness">Front thickness</label>
        <div class="input-unit">
          <input id="f-front_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="front_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="front_thickness"></div>
      </div>
      <div class="row">
        <label for="f-front_gap" data-i18n="field.front_gap">Gap between fronts</label>
        <div class="input-unit">
          <input id="f-front_gap" type="text" inputmode="decimal" autocomplete="off" data-key="front_gap" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="front_gap"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-edge_gap_left" data-i18n="field.edge_gap_left">Edge gap left</label>
        <div class="input-unit">
          <input id="f-edge_gap_left" type="text" inputmode="decimal" autocomplete="off" data-key="edge_gap_left" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.edge_gaps"></div>
        <div class="field-error" data-error-for="edge_gap_left"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-edge_gap_right" data-i18n="field.edge_gap_right">Edge gap right</label>
        <div class="input-unit">
          <input id="f-edge_gap_right" type="text" inputmode="decimal" autocomplete="off" data-key="edge_gap_right" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="edge_gap_right"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-edge_gap_top" data-i18n="field.edge_gap_top">Edge gap top</label>
        <div class="input-unit">
          <input id="f-edge_gap_top" type="text" inputmode="decimal" autocomplete="off" data-key="edge_gap_top" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="edge_gap_top"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-edge_gap_bottom" data-i18n="field.edge_gap_bottom">Edge gap bottom</label>
        <div class="input-unit">
          <input id="f-edge_gap_bottom" type="text" inputmode="decimal" autocomplete="off" data-key="edge_gap_bottom" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="edge_gap_bottom"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-front_extend_top" data-i18n="field.front_extend_top">Extend front up</label>
        <div class="input-unit">
          <input id="f-front_extend_top" type="text" inputmode="decimal" autocomplete="off" data-key="front_extend_top" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="front_extend_top"></div>
      </div>
      <div class="row" data-show-if="front_mount=overlay">
        <label for="f-front_extend_bottom" data-i18n="field.front_extend_bottom">Extend front down</label>
        <div class="input-unit">
          <input id="f-front_extend_bottom" type="text" inputmode="decimal" autocomplete="off" data-key="front_extend_bottom" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.front_extend"></div>
        <div class="field-error" data-error-for="front_extend_bottom"></div>
      </div>
      <div class="row" data-show-if="front_mount=inset">
        <label for="f-inset_gap" data-i18n="field.inset_gap">Gap to carcass</label>
        <div class="input-unit">
          <input id="f-inset_gap" type="text" inputmode="decimal" autocomplete="off" data-key="inset_gap" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="inset_gap"></div>
      </div>
      <div class="row" data-show-if="front_mount=inset">
        <label for="f-inset_setback" data-i18n="field.inset_setback">Inset setback</label>
        <div class="input-unit">
          <input id="f-inset_setback" type="text" inputmode="decimal" autocomplete="off" data-key="inset_setback" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.inset_setback"></div>
        <div class="field-error" data-error-for="inset_setback"></div>
      </div>
    </details>

    <details class="section" open data-categories="base" data-show-if="cabinet_type=drawers">
      <summary data-i18n="section.drawers">Drawers</summary>
      <div class="row">
        <label for="f-drawer_count" data-i18n="field.drawer_count">Number of drawers</label>
        <div class="input-unit">
          <input id="f-drawer_count" type="text" inputmode="numeric" autocomplete="off" data-key="drawer_count" data-type="int">
          <span class="unit"></span>
        </div>
        <div class="field-error" data-error-for="drawer_count"></div>
      </div>
      <div class="row">
        <label for="f-drawer_heights" data-i18n="field.drawer_heights">Front heights (top to bottom)</label>
        <div class="input-unit">
          <input id="f-drawer_heights" type="text" inputmode="text" autocomplete="off" data-key="drawer_heights" data-type="text">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.drawer_heights"></div>
        <div class="field-error" data-error-for="drawer_heights"></div>
      </div>
      <div class="row">
        <label for="f-drawer_box_height" data-i18n="field.drawer_box_height">Drawer box height</label>
        <div class="input-unit">
          <input id="f-drawer_box_height" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_box_height" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.auto_zero"></div>
        <div class="field-error" data-error-for="drawer_box_height"></div>
      </div>
      <div class="row">
        <label for="f-drawer_box_depth" data-i18n="field.drawer_box_depth">Drawer box depth</label>
        <div class="input-unit">
          <input id="f-drawer_box_depth" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_box_depth" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.drawer_box_depth"></div>
        <div class="field-error" data-error-for="drawer_box_depth"></div>
      </div>
      <div class="row">
        <label for="f-drawer_side_thickness" data-i18n="field.drawer_side_thickness">Box side thickness</label>
        <div class="input-unit">
          <input id="f-drawer_side_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_side_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="drawer_side_thickness"></div>
      </div>
      <div class="row">
        <label for="f-drawer_bottom_thickness" data-i18n="field.drawer_bottom_thickness">Box bottom thickness</label>
        <div class="input-unit">
          <input id="f-drawer_bottom_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_bottom_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="drawer_bottom_thickness"></div>
      </div>
      <div class="row">
        <label for="f-slide_clearance" data-i18n="field.slide_clearance">Slide clearance per side</label>
        <div class="input-unit">
          <input id="f-slide_clearance" type="text" inputmode="decimal" autocomplete="off" data-key="slide_clearance" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="slide_clearance"></div>
      </div>
      <div class="row">
        <label for="f-slide_depth_clearance" data-i18n="field.slide_depth_clearance">Slide depth clearance</label>
        <div class="input-unit">
          <input id="f-slide_depth_clearance" type="text" inputmode="decimal" autocomplete="off" data-key="slide_depth_clearance" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.slide_depth_clearance"></div>
        <div class="field-error" data-error-for="slide_depth_clearance"></div>
      </div>
      <div class="row">
        <label for="f-drawer_front_clearance" data-i18n="field.drawer_front_clearance">Box gap behind front</label>
        <div class="input-unit">
          <input id="f-drawer_front_clearance" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_front_clearance" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="drawer_front_clearance"></div>
      </div>
      <div class="row">
        <label for="f-drawer_bottom_clearance" data-i18n="field.drawer_bottom_clearance">Box gap below</label>
        <div class="input-unit">
          <input id="f-drawer_bottom_clearance" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_bottom_clearance" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="drawer_bottom_clearance"></div>
      </div>
      <div class="row">
        <label for="f-drawer_top_clearance" data-i18n="field.drawer_top_clearance">Box gap above</label>
        <div class="input-unit">
          <input id="f-drawer_top_clearance" type="text" inputmode="decimal" autocomplete="off" data-key="drawer_top_clearance" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="drawer_top_clearance"></div>
      </div>
    </details>

    <details class="section" open data-categories="base">
      <summary data-i18n="section.supports">Plinth and Legs</summary>
      <div class="row">
        <label for="f-support_type" data-i18n="field.support_type">Supports</label>
        <select id="f-support_type" data-key="support_type" data-type="enum">
          <option value="legs_with_plinth" data-i18n="option.support.legs_with_plinth">Legs + plinth board</option>
          <option value="legs" data-i18n="option.support.legs">Adjustable legs</option>
          <option value="plinth_box" data-i18n="option.support.plinth_box">Plinth boards (no legs)</option>
          <option value="none" data-i18n="option.support.none">None</option>
        </select>
        <div class="field-error" data-error-for="support_type"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth,plinth_box">
        <label for="f-plinth_height" data-i18n="field.plinth_height">Plinth / legs height</label>
        <div class="input-unit">
          <input id="f-plinth_height" type="text" inputmode="decimal" autocomplete="off" data-key="plinth_height" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.plinth_height"></div>
        <div class="field-error" data-error-for="plinth_height"></div>
      </div>
      <div class="row" data-show-if="support_type=legs_with_plinth,plinth_box">
        <label for="f-plinth_setback" data-i18n="field.plinth_setback">Plinth setback</label>
        <div class="input-unit">
          <input id="f-plinth_setback" type="text" inputmode="decimal" autocomplete="off" data-key="plinth_setback" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.plinth_setback"></div>
        <div class="field-error" data-error-for="plinth_setback"></div>
      </div>
      <div class="row" data-show-if="support_type=legs_with_plinth,plinth_box">
        <label for="f-plinth_thickness" data-i18n="field.plinth_thickness">Plinth board thickness</label>
        <div class="input-unit">
          <input id="f-plinth_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="plinth_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="plinth_thickness"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth">
        <label for="f-leg_diameter" data-i18n="field.leg_diameter">Leg diameter</label>
        <div class="input-unit">
          <input id="f-leg_diameter" type="text" inputmode="decimal" autocomplete="off" data-key="leg_diameter" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="leg_diameter"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth">
        <label for="f-leg_offset_side" data-i18n="field.leg_offset_side">Leg offset from side</label>
        <div class="input-unit">
          <input id="f-leg_offset_side" type="text" inputmode="decimal" autocomplete="off" data-key="leg_offset_side" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.leg_offset"></div>
        <div class="field-error" data-error-for="leg_offset_side"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth">
        <label for="f-leg_offset_front" data-i18n="field.leg_offset_front">Leg offset from front</label>
        <div class="input-unit">
          <input id="f-leg_offset_front" type="text" inputmode="decimal" autocomplete="off" data-key="leg_offset_front" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.leg_offset"></div>
        <div class="field-error" data-error-for="leg_offset_front"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth">
        <label for="f-leg_offset_rear" data-i18n="field.leg_offset_rear">Leg offset from back</label>
        <div class="input-unit">
          <input id="f-leg_offset_rear" type="text" inputmode="decimal" autocomplete="off" data-key="leg_offset_rear" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.leg_offset"></div>
        <div class="field-error" data-error-for="leg_offset_rear"></div>
      </div>
      <div class="row" data-show-if="support_type=legs,legs_with_plinth">
        <label for="f-middle_legs_from" data-i18n="field.middle_legs_from">Middle legs from width</label>
        <div class="input-unit">
          <input id="f-middle_legs_from" type="text" inputmode="decimal" autocomplete="off" data-key="middle_legs_from" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.middle_legs_from"></div>
        <div class="field-error" data-error-for="middle_legs_from"></div>
      </div>
    </details>

    <details class="section" open data-categories="wall">
      <summary data-i18n="section.mounting">Wall Mounting</summary>
      <div class="row checkbox-row">
        <label for="f-hanging_rail" data-i18n="field.hanging_rail">Hanging rail</label>
        <div><input id="f-hanging_rail" type="checkbox" data-key="hanging_rail" data-type="bool"></div>
        <div class="hint" data-i18n="hint.hanging_rail"></div>
        <div class="field-error" data-error-for="hanging_rail"></div>
      </div>
      <div class="row" data-show-if="hanging_rail=true">
        <label for="f-rail_height" data-i18n="field.rail_height">Rail height</label>
        <div class="input-unit">
          <input id="f-rail_height" type="text" inputmode="decimal" autocomplete="off" data-key="rail_height" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="rail_height"></div>
      </div>
      <div class="row" data-show-if="hanging_rail=true">
        <label for="f-rail_thickness" data-i18n="field.rail_thickness">Rail thickness</label>
        <div class="input-unit">
          <input id="f-rail_thickness" type="text" inputmode="decimal" autocomplete="off" data-key="rail_thickness" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="field-error" data-error-for="rail_thickness"></div>
      </div>
    </details>

    <details class="section" open>
      <summary data-i18n="section.placement">Placement</summary>
      <div class="row" data-categories="base">
        <label for="f-elevation" data-i18n="field.elevation">Cabinet elevation</label>
        <div class="input-unit">
          <input id="f-elevation" type="text" inputmode="decimal" autocomplete="off" data-key="elevation" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.elevation"></div>
        <div class="field-error" data-error-for="elevation"></div>
      </div>
      <div class="row" data-categories="wall">
        <label for="f-mount_height" data-i18n="field.mount_height">Mounting height</label>
        <div class="input-unit">
          <input id="f-mount_height" type="text" inputmode="decimal" autocomplete="off" data-key="mount_height" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.mount_height"></div>
        <div class="field-error" data-error-for="mount_height"></div>
      </div>
      <div class="row">
        <label for="f-wall_gap" data-i18n="field.wall_gap">Distance from wall</label>
        <div class="input-unit">
          <input id="f-wall_gap" type="text" inputmode="decimal" autocomplete="off" data-key="wall_gap" data-type="mm">
          <span class="unit" data-i18n="unit.mm">mm</span>
        </div>
        <div class="hint" data-i18n="hint.wall_gap"></div>
        <div class="field-error" data-error-for="wall_gap"></div>
      </div>
    </details>
  </main>

  <footer class="app-footer">
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div class="buttons">
      <button type="button" id="btn-create" class="primary" data-i18n="button.create">Create Cabinet</button>
      <button type="button" id="btn-update" data-i18n="button.update" disabled>Update Selected</button>
    </div>
    <div class="buttons secondary-buttons">
      <button type="button" id="btn-load" data-i18n="button.load_selected">Load Selected</button>
      <button type="button" id="btn-reset" data-i18n="button.reset">Reset Defaults</button>
      <button type="button" id="btn-close" data-i18n="button.close">Close</button>
    </div>
    <div id="version" class="version"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
